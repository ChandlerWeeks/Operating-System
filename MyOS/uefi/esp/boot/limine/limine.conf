# limine.conf — Limine 12+ format
# Place at: esp/boot/limine/limine.conf
# -- Global Settings ---------------------------------------------------
# Use "no" to show the menu and wait indefinitely.
# Use 0 to boot instantly to the default entry.
# Use > 0 to set a timeout in seconds before auto-booting the first entry.
timeout: 0
# Turn off Limine's boot messages to serial.
serial: no
# Verbose output should only be for debugging.
verbose: no
# Turn off graphics mode
graphics: no
# Default to our only entry
default_entry: 1
# -- Our OS ------------------------------------------------------------
/COSC562 OS (RISC-V)
    # Use the Limine boot protocol
    protocol: limine
    # boot() = the volume Limine was loaded from (your ESP)
    kernel_path: boot():/boot/os.elf
    # Optional: kernel command line arguments
    kernel_cmdline: doofussy
    # Disable KASLR during development. This makes addresses predictable.
    kaslr: no
