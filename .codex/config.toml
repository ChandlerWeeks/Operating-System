# Give the local model the full Codex toolset while retaining repository-first
# guidance and a response length suitable for technical explanations.
model_verbosity = "high"
model_reasoning_effort = "high"
web_search = "live"

developer_instructions = """
Work as a repository-first coding agent. For questions about this operating
system, inspect the files in the current repository before you answer. Start
with a small, targeted shell query such as `pwd`, `rg --files` with
`MyOS/target/` excluded, or `rg` for the requested topic. Never use `ls -R`,
repeat the same command, or enumerate generated build artifacts. After each
tool result, continue the user's original task. Finish with a plain-text answer
that directly addresses the original request. Do not discuss Sites, vinext,
deployments, project IDs, or site environment variables unless the user asks
about them explicitly. For explanation or review requests, do not propose code
changes and do not change files. Use web search, plugins, apps, goals, browser
tools, and delegation when they materially help with the user's request.
"""

[features]
apps = true
plugins = true
goals = true
multi_agent = true
browser_use = true
computer_use = true
